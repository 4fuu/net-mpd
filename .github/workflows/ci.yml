name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -timeout 60s ./...

      - name: Validate Homebrew formula
        run: ruby -c Formula/net-mpd.rb

      - name: Verify release target builds
        shell: bash
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            CGO_ENABLED=0 go build -o /tmp/net-mpd-$GOOS-$GOARCH ./cmd/net-mpd
          done

      - name: Check generated diff
        run: git diff --check && git diff --exit-code

  windows:
    name: Windows native
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -timeout 60s ./...

      - name: Build executable
        run: go build -trimpath -o net-mpd.exe ./cmd/net-mpd

  homebrew:
    name: Homebrew formula
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Add local tap
        run: brew tap 4fuu/net-mpd "$GITHUB_WORKSPACE"

      - name: Install and test formula
        run: |
          brew install 4fuu/net-mpd/net-mpd
          brew test 4fuu/net-mpd/net-mpd
